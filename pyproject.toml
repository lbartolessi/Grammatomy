[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grammatomy"
version = "0.1.0"
description = "Universal Constituent Parser (AnyTree Wrapper)"
authors = [{name = "Wayfarer", email = "wayfarer@mnemosyne.net"}]
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "stanza",
    "spacy",
    "benepar",
    "anytree",
    "transformers>=4.30.0", # For HuggingFace models, often used with Benepar/Stanza
    "torch", # Explicit dependency often needed for Stanza/Benepar if not pulled automatically
    "accelerate", # For optimizing PyTorch models, often used with transformers
    "streamlit",
    "graphviz",
    "nltk",
    "huggingface_hub",
    "protobuf",
    "langdetect",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
    "pylint",
    "httpx"
]
gui = [
    "PyQt6"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grammatomy-studio = "grammatomy.tools.studio:main"

[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["PyQt6"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]
good-names = [
    "e", "i", "j", "k", "v", # common loop variables
    "ex", # common exception variable
    "fp", # file pointer
    "wheelEvent",
    "itemChange",
    "mouseMoveEvent",
    "mouseReleaseEvent",
    "contextMenuEvent",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
filterwarnings = [
    "ignore:.*SwigPy.*:DeprecationWarning",
    "ignore:.*swigvarlink.*:DeprecationWarning",
    "ignore:.*torch_struct.*:UserWarning"
]