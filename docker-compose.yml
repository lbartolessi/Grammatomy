services:
  grammatomy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grammatomy-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount the source code for live-reloading during development
      - ./src/core:/app/src/core
      - ./src/api:/app/src/api
      # Mount the models directory to avoid re-downloading on every container start
      - ./models:/app/models
    # Uncomment below to enable GPU acceleration (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]