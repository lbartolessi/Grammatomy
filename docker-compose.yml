services:
  grammatomy-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grammatomy-demo
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    # Uncomment below to enable GPU acceleration (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  nginx-proxy:
    image: nginx:alpine
    container_name: grammatomy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grammatomy-demo