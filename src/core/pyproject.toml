[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grammatomy-lib"
version = "0.2.0"
description = "Core Logic for Grammatomy: Hybrid Constituent Parsing & Validation"
authors = [{name = "Wayfarer", email = "wayfarer@mnemosyne.net"}]
requires-python = ">=3.10"
dependencies = [
    "stanza>=1.5.0",
    "spacy>=3.5.0",
    "benepar",
    "anytree",
    "transformers>=4.30.0",
    "torch",
    "accelerate",
    "nltk",
    "huggingface_hub",
    "protobuf",
    "langdetect",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]  # Busca el paquete 'grammatomy' aquí mismo

[project.optional-dependencies]
dev = ["pytest", "black", "pylint"]
[tool.pylint.format]
max-line-length = 120
