tree_config:
  language: "es"
  standard: "AnCora / Universal Dependencies"
  description: "Matriz de relaciones jerárquicas para procesamiento de constituyentes en español"
  version: "2.5.0-Expert"

nodes:
  - id: "ROOT"
    description: "Raíz del árbol"
    is_terminal: false
    root_allowed: true
    allowed_parents: []
    allowed_children:
      mandatory: []
      optional: ["S", "sentence", "sq", "sinv", "frag", "sn", "interjeccio"]

  - id: "S"
    description: "Nodo oracional (Sentence) o cláusula subordinada"
    is_terminal: false
    root_allowed: true
    allowed_parents: ["ROOT", "grup.nom", "sp", "S", "sentence"]
    allowed_children:
      mandatory: ["grup.verb"]
      optional: ["sn", "sn.suj", "sn.cd", "sn.ci", "sp", "sadv", "s.a", "NUM", "conj", "morfema.verbal", "neg", "PUNCT", "fc", "fp", ",", "."]
    functional_variants: ["sentence", "S.relatiu", "S.completiva"]

  - id: "sn"
    description: "Sintagma Nominal (Noun Phrase)"
    is_terminal: false
    root_allowed: true
    allowed_parents: ["S", "sentence", "sp", "grup.verb", "grup.nom"]
    allowed_children:
      mandatory: ["grup.nom"]
      optional: ["spec", "s.a", "sp", "sn", "NUM", "conj", "DET", "PUNCT"]
    functional_variants: ["sn.suj", "sn.cd", "sn.ci", "sn.cc", "sn.atr", "sn.creg", "sn.cpred", "sn.cag"]

  - id: "grup.nom"
    description: "Grupo Nominal (Núcleo léxico del SN)"
    is_terminal: false
    allowed_parents: ["sn"]
    allowed_children:
      mandatory: ["NOUN", "PROPN", "PRON"]
      optional: ["s.a", "sp", "S", "grup.nom", "conj", "CCONJ", "NUM", "PUNCT"]

  - id: "sp"
    description: "Sintagma Preposicional (Prepositional Phrase)"
    is_terminal: false
    allowed_parents: ["grup.nom", "grup.verb", "s.a", "sadv"]
    allowed_children:
      mandatory: ["ADP", "prep"]
      optional: ["sn", "S", "sadv", "grup.adv"]
    functional_variants: ["sp.creg", "sp.cc", "sp.cd", "sp.ci", "sp.atr", "sp.cag", "sp.cn"]

  - id: "grup.verb"
    description: "Grupo Verbal (Núcleo de la predicación)"
    is_terminal: false
    allowed_parents: ["S", "sentence"]
    allowed_children:
      mandatory: ["VERB", "AUX"]
      optional: ["morfema.pronominal", "neg", "sadv", "sn", "sp", "infinitivo", "gerundio", "participio", "NUM", "PUNCT"]

  - id: "s.a"
    description: "Sintagma Adjetival"
    is_terminal: false
    allowed_parents: ["grup.nom", "sn"]
    allowed_children:
      mandatory: ["grup.a", "ADJ"]
      optional: ["sadv", "sp", "NUM", "conj"]
    functional_variants: ["sa.atr", "sa.cpred", "sa.cn"]

  - id: "grup.a"
    description: "Grupo Adjetival"
    is_terminal: false
    allowed_parents: ["s.a"]
    allowed_children:
      mandatory: ["ADJ"]
      optional: ["sadv", "sp"]

  - id: "sadv"
    description: "Sintagma Adverbial"
    is_terminal: false
    allowed_parents: ["grup.verb", "sp", "s.a"]
    allowed_children:
      mandatory: ["grup.adv", "ADV"]
      optional: ["sp", "sadv", "NUM"]

  - id: "grup.adv"
    description: "Grupo Adverbial"
    is_terminal: false
    allowed_parents: ["sadv"]
    allowed_children:
      mandatory: ["ADV"]
      optional: ["sp"]

  - id: "spec"
    description: "Especificador"
    is_terminal: false
    allowed_parents: ["sn"]
    allowed_children:
      mandatory: ["DET"]
      optional: ["NUM"]

  - id: "coord"
    description: "Nodo de coordinación"
    is_terminal: false
    allowed_parents: ["grup.nom", "S", "sentence"]
    allowed_children:
      mandatory: []
      optional: ["conj", "CCONJ", "PUNCT"]

  # --- TERMINALES (POS UD) ---
  - id: "VERB"
    description: "Verbo"
    is_terminal: true
    allowed_parents: ["grup.verb"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "AUX"
    description: "Verbo Auxiliar"
    is_terminal: true
    allowed_parents: ["grup.verb"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "NOUN"
    description: "Sustantivo"
    is_terminal: true
    allowed_parents: ["grup.nom"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "PROPN"
    description: "Nombre Propio"
    is_terminal: true
    allowed_parents: ["grup.nom"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "PRON"
    description: "Pronombre"
    is_terminal: true
    allowed_parents: ["grup.nom"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "ADP"
    description: "Preposición"
    is_terminal: true
    allowed_parents: ["sp"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "DET"
    description: "Determinante"
    is_terminal: true
    allowed_parents: ["spec"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "ADJ"
    description: "Adjetivo"
    is_terminal: true
    allowed_parents: ["grup.a", "s.a"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "ADV"
    description: "Adverbio"
    is_terminal: true
    allowed_parents: ["grup.adv", "sadv"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "NUM"
    description: "Numeral"
    is_terminal: true
    allowed_parents: ["grup.nom", "spec"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "CCONJ"
    description: "Conjunción Coordinante"
    is_terminal: true
    allowed_parents: ["coord", "grup.nom", "S", "sentence"]
    allowed_children:
      mandatory: []
      optional: []

  - id: "conj"
    description: "Conjunción (AnCora)"
    es_terminal: false
    allowed_parents: ["coord", "grup.nom", "S", "sentence", "sn", "s.a"]
    allowed_children:
      mandatory: ["CCONJ"]
      optional: []

  - id: "PUNCT"
    description: "Puntuación"
    is_terminal: true
    allowed_parents: ["S", "sentence", "sn", "grup.nom", "grup.verb"]
    allowed_children:
      mandatory: []
      optional: []

  # Ghost Nodes
  - id: "👻Node"
    description: "Ghost Phrasal Node"
    is_terminal: false
    allowed_parents: []
    allowed_children:
      mandatory: ["👻POS"]
      optional: []

  - id: "👻POS"
    description: "Ghost POS Node"
    is_terminal: true
    allowed_parents: ["👻Node"]
    allowed_children:
      mandatory: ["👻Word"]
      optional: []

  - id: "👻Word"
    description: "Ghost Terminal"
    is_terminal: true
    allowed_parents: ["👻POS"]
    allowed_children:
      mandatory: []
      optional: []