configuracion_arbol:
  idioma: "es"
  estandar: "AnCora / Penn Treebank II (Híbrido)"
  descripcion: "Matriz de relaciones jerárquicas para procesamiento de constituyentes en español"
  version: "2.5.0-Expert"

nodos:
  # --- Nivel Oracional (Sentence Level) ---
  - id: "S"
    descripcion: "Nodo oracional (Sentence) o cláusula subordinada"
    raiz_permitida: true
    hijos_permitidos:
      obligatorios: []
      opcionales: 
        - "NP"
        - "VP"
        - "PP"
        - "ADVP"
        - "CC"
        - "S"
        - "SBAR"
        - "PRN"
        - "INTJ"
        - "sn"
        - "grup.verb"
        - "grup.nom"
        - "PUNCT"
        - "sn.suj"
        - "sn.cd"
        - "sn.ci"
        - "sp"
        - "sadv"
        - "s.a"
        - "PUNCT"
        - "CCONJ"
        - "SCONJ"
        - "morfema.verbal"
        - "neg"
        - "infinitiu"
        - "gerundi"
        - "participi"
        - "relatiu"

  - id: "ROOT"
    descripcion: "Raíz del árbol"
    hijos_permitidos:
      obligatorios: ["S"]
      opcionales: ["SQ", "SINV", "FRAG", "TOP", "sentence"]

  - id: "SQ"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["AUX", "NP", "VP", "ADVP"]

  - id: "SINV"
    hijos_permitidos:
      obligatorios: ["VP", "NP"]
      opcionales: []

  # --- Penn Treebank Phrase Level ---
  - id: "NP"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["DT", "PDT", "NN", "NNS", "NNP", "NNPS", "PRP", "PRP$", "JJ", "ADJP", "PP", "SBAR", "PRN", "CONJP", "CC", "CD", "QP", "NX", "spec", "grup.a", "s.a", "sn"]

  - id: "VP"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["VB", "VBD", "VBG", "VBN", "VBP", "VBZ", "MD", "AUX", "NP", "PP", "ADJP", "ADVP", "S", "SBAR", "PRT", "CC", "PRN", "neg"]

  - id: "PP"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["IN", "TO", "PREP", "NP", "S", "SBAR", "ADVP", "sn"]

  - id: "ADJP"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["JJ", "JJR", "JJS", "RB", "RBR", "RBS", "PP", "S", "VP", "CC"]

  - id: "ADVP"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["RB", "RBR", "RBS", "PP", "NP", "CC"]

  - id: "SBAR"
    hijos_permitidos:
      obligatorios: []
      opcionales: ["IN", "DT", "WDT", "WP", "WRB", "S", "SQ"]

  # --- AnCora Specific ---
  - id: "sn"
    descripcion: "Sintagma Nominal (Noun Phrase)"
    raiz_permitida: true
    hijos_permitidos:
      obligatorios: ["grup.nom"]
      opcionales: ["spec", "s.a", "sp", "sn", "PUNCT", "CCONJ", "SCONJ", "DET", "PRON", "ADJ"]

  - id: "grup.nom"
    descripcion: "Grupo Nominal (Núcleo léxico del SN)"
    padres_permitidos: ["sn"]
    hijos_permitidos:
      obligatorios: ["NOUN", "PROPN", "PRON"]
      opcionales: ["s.a", "sp", "sn", "grup.z", "NUM", "S", "SBAR", "PRON", "DET", "PUNCT"]

  - id: "grup.verb"
    descripcion: "Grupo Verbal (Núcleo de la predicación)"
    hijos_permitidos:
      obligatorios: ["VERB", "AUX"]
      opcionales: ["morfema.pronominal", "neg", "sadv", "infinitivo", "infinitiu", "gerundio", "participio", "PUNCT", "sn", "sp", "S", "AUX", "PRON"]

  - id: "sp"
    descripcion: "Sintagma Preposicional"
    hijos_permitidos:
      obligatorios: ["ADP"]
      opcionales: ["sn", "S", "sadv", "sp", "CCONJ", "SCONJ", "ADP", "PUNCT"]

  - id: "coord"
    hijos_permitidos:
      obligatorios: [] # Requiere lógica especial (>1 hijo)
      opcionales: ["CCONJ", "SCONJ", "PUNCT"]

  - id: "grup.z"
    descripcion: "Grupo de Cifras/Números"
    hijos_permitidos:
      obligatorios: ["NUM", "SYM"]
      opcionales: ["PUNCT", "CCONJ", "sp", "s.a", "SYM"]

  - id: "sadv"
    descripcion: "Sintagma Adverbial"
    hijos_permitidos:
      obligatorios: ["grup.adv", "ADV", "neg"]
      opcionales: ["sp", "sadv", "PUNCT", "ADV"]

  - id: "s.a"
    descripcion: "Sintagma Adjetival"
    hijos_permitidos:
      obligatorios: ["grup.a", "ADJ", "PART"]
      opcionales: ["sadv", "sp", "PUNCT", "ADJ"]